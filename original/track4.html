<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#247b88"><title>QUA — Golden Coast</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#247b88;color:#fff4cf;font-family:Georgia,serif}
#scene{position:fixed;inset:0;touch-action:none;pointer-events:auto}canvas{display:block;width:100%;height:100%;touch-action:none}
#wordmark{position:fixed;top:calc(24px + env(safe-area-inset-top));left:24px;pointer-events:none;font-size:17px;letter-spacing:.45em;text-shadow:0 2px 20px #153b4d}#wordmark small{display:block;margin-top:10px;font-size:9px;letter-spacing:.26em;opacity:.72}
#guide{position:fixed;right:20px;top:calc(23px + env(safe-area-inset-top));text-align:right;font:12px/1.8 Georgia,serif;text-shadow:0 2px 8px #163749;pointer-events:none}
#nav{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
button,a{-webkit-tap-highlight-color:transparent}#nav a,#nav button{color:#fff2ce;border:1px solid #fff2ce55;background:#082c39b8;border-radius:3px;padding:12px 15px;min-height:44px;font:11px Georgia,serif;text-decoration:none;letter-spacing:.1em;white-space:nowrap;cursor:pointer}#nav a:hover,#nav button:hover{background:#164951d9;border-color:#ffdc8a}
#joystick{display:none;position:fixed;width:104px;height:104px;left:calc(22px + env(safe-area-inset-left));bottom:calc(88px + env(safe-area-inset-bottom));border:1px solid #fff3cf77;border-radius:50%;background:#153f4940;touch-action:none;pointer-events:auto}
#stick{position:absolute;left:32px;top:32px;width:38px;height:38px;border-radius:50%;border:1px solid #fff4d0b0;background:#f9de8b44;pointer-events:none}
#status{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;text-align:center;text-shadow:0 2px 8px #163749;pointer-events:none}
@media(pointer:coarse),(max-width:768px){#joystick{display:block}#guide{max-width:170px;font-size:11px}#wordmark{left:18px;font-size:14px}#nav{gap:6px}#nav a,#nav button{padding:12px;font-size:10px}}
</style></head><body>
<div id="scene" aria-label="Steer a golden triangle over an endless tropical coast"></div>
<div id="wordmark">QUA<small>GOLDEN COAST</small></div>
<div id="guide">Drag to steer · arrows / WASD<br>Up / down to climb / descend<br>Always in flight</div>
<div id="joystick" role="group" aria-label="Hold and drag to steer and change altitude"><span id="stick"></span></div>
<div id="status" role="status"></div>
<nav id="nav" aria-label="Track navigation"><a href="index.html">Home</a><a href="track3.html">Previous Track</a><button id="reset" type="button">Recenter</button><button id="musicButton" type="button">Sound soon</button></nav>
<audio id="music" loop playsinline preload="none"></audio>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="golden-coast.js?v=2"></script>
</body></html>
