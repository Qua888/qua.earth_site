<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#07131b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Qua — Golden Coast</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; background: #07131b; font-family: Georgia, serif; touch-action: none; }
    #scene { position: fixed; inset: 0; outline: none; cursor: grab; }
    #scene.dragging { cursor: grabbing; }
    #title { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 18px; z-index: 4; color: rgba(255,235,184,.82); letter-spacing: .28em; font-size: 11px; text-transform: uppercase; text-shadow: 0 0 14px rgba(255,181,62,.4); pointer-events: none; }
    #hint { position: fixed; right: 16px; top: max(14px, env(safe-area-inset-top)); z-index: 4; max-width: 270px; color: rgba(226,242,241,.72); font-size: 11px; line-height: 1.45; text-align: right; pointer-events: none; }
    #nav { position: fixed; z-index: 5; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(calc(100% - 24px), 520px); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-bottom: env(safe-area-inset-bottom); }
    button { min-height: 44px; border: 1px solid rgba(255,224,148,.34); background: rgba(4,10,15,.82); color: #f8e7b0; padding: 10px 15px; font: 11px Georgia, serif; letter-spacing: .14em; cursor: pointer; }
    button:hover, button:focus-visible { border-color: #ffd46f; box-shadow: 0 0 18px rgba(255,196,72,.22); outline: none; }
    #touch { position: fixed; z-index: 5; left: 14px; bottom: max(14px, env(safe-area-inset-bottom)); display: none; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 5px; opacity: .75; }
    #touch button { padding: 0; background: rgba(5,12,17,.62); }
    #touch .up { grid-column: 2; } #touch .left { grid-column: 1; grid-row: 2; } #touch .down { grid-column: 2; grid-row: 2; } #touch .right { grid-column: 3; grid-row: 2; }
    @media (pointer: coarse), (max-width: 768px) { #touch { display: grid; } #hint { top: auto; bottom: 82px; right: 14px; font-size: 10px; } #nav { left: auto; right: 12px; transform: none; width: auto; max-width: calc(100% - 170px); } button { padding: 9px 12px; } }
  </style>
</head>
<body>
  <div id="scene" tabindex="0"></div>
  <div id="title">QUA / GOLDEN COAST</div>
  <div id="hint">drag to steer · arrows / WASD to fly<br>Q / E altitude · touch pad on mobile<br><span id="status">golden triangle ready</span></div>
  <div id="touch" aria-label="Touch flight controls">
    <button class="up" data-key="ArrowUp" aria-label="Fly forward">▲</button>
    <button class="left" data-key="ArrowLeft" aria-label="Fly left">◀</button>
    <button class="down" data-key="ArrowDown" aria-label="Fly back">▼</button>
    <button class="right" data-key="ArrowRight" aria-label="Fly right">▶</button>
  </div>
  <nav id="nav">
    <button type="button" onclick="location.href='index.html'">Home</button>
    <button type="button" onclick="location.href='track3.html'">Previous Track</button>
    <button id="playBtn" type="button">Play Track</button>
  </nav>
  <audio id="music" loop playsinline preload="none"></audio>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    (() => {
      const host = document.getElementById('scene');
      const status = document.getElementById('status');
      const playBtn = document.getElementById('playBtn');
      const music = document.getElementById('music');
      const mobile = matchMedia('(pointer: coarse)').matches || innerWidth <= 768;
      const pixelRatio = Math.min(devicePixelRatio || 1, mobile ? 1.15 : 1.35);
      const keys = Object.create(null);
      const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
      const rand = (a, b) => a + Math.random() * (b - a);

      const renderer = new THREE.WebGLRenderer({ antialias: !mobile, powerPreference: 'high-performance' });
      renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setClearColor(0x07131b, 1); host.appendChild(renderer.domElement);
      const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x123748, 2400, 12000);
      const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 1, 18000);
      const sun = new THREE.DirectionalLight(0xffd694, 2.2); sun.position.set(-1400, 2600, 2200); scene.add(sun); scene.add(new THREE.HemisphereLight(0x87c8d1, 0x10232b, 1.25));

      const water = new THREE.Mesh(new THREE.PlaneGeometry(15000, 15000, 40, 40), new THREE.MeshStandardMaterial({ color: 0x0d5870, roughness: .34, metalness: .12, transparent: true, opacity: .96 }));
      water.rotation.x = -Math.PI / 2; scene.add(water);
      const islandMat = new THREE.MeshStandardMaterial({ color: 0x234f47, roughness: .93, flatShading: true });
      const sandMat = new THREE.MeshStandardMaterial({ color: 0xb18b55, roughness: .96 });
      const ruinMat = new THREE.MeshStandardMaterial({ color: 0x75624c, roughness: .96, flatShading: true });
      const islandGroup = new THREE.Group(); scene.add(islandGroup);
      const islandLayout = [[-2200,-2100,1.2],[0,-3100,1.4],[2400,-2500,1.05],[-3400,-4600,1.7],[-900,-5100,1.25],[2100,-5600,1.55],[4400,-4300,1.2],[-3800,-7000,1.45],[-1200,-7700,1.8],[2500,-7600,1.35]];
      islandLayout.forEach(([x,z,s], index) => {
        const island = new THREE.Group(); island.position.set(x, 0, z); island.scale.setScalar(s);
        const base = new THREE.Mesh(new THREE.CylinderGeometry(220, 340, 80, 8), islandMat); base.position.y = 35; island.add(base);
        const shore = new THREE.Mesh(new THREE.CylinderGeometry(280, 410, 14, 8), sandMat); shore.position.y = 6; island.add(shore);
        const crown = new THREE.Mesh(new THREE.ConeGeometry(160, rand(190, 350), 7), islandMat); crown.position.y = 170; island.add(crown);
        if (index % 2 === 0) {
          for (let r = 0; r < 3; r++) { const ruin = new THREE.Mesh(new THREE.BoxGeometry(55, rand(100, 210), 55), ruinMat); ruin.position.set((r - 1) * 95, 110, rand(-100, 100)); ruin.rotation.y = rand(0, Math.PI); island.add(ruin); }
        }
        islandGroup.add(island);
      });

      const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(170, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffd36a })); sunGlow.position.set(-3600, 3100, -6200); scene.add(sunGlow);
      const triangle = new THREE.Group();
      const gold = new THREE.MeshStandardMaterial({ color: 0xffc84d, emissive: 0x6d3b09, emissiveIntensity: .5, metalness: .78, roughness: .22, side: THREE.DoubleSide });
      const wing = new THREE.Mesh(new THREE.ConeGeometry(105, 180, 3), gold); wing.rotation.x = Math.PI / 2; triangle.add(wing);
      const aura = new THREE.Mesh(new THREE.TorusGeometry(132, 3, 8, 32), new THREE.MeshBasicMaterial({ color: 0xffe9a0, transparent: true, opacity: .7, blending: THREE.AdditiveBlending })); aura.rotation.x = Math.PI / 2; triangle.add(aura);
      triangle.position.set(0, 520, 700); scene.add(triangle);
      const flight = { yaw: 0, pitch: -.16, vx: 0, vy: 0, vz: -2.4, x: 0, y: 520, z: 700 };
      let dragging = false, lastX = 0, lastY = 0;
      function setKey(code, down) { keys[code] = down; if (down) host.focus({ preventScroll: true }); }
      addEventListener('keydown', e => { if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE'].includes(e.code)) { setKey(e.code, true); e.preventDefault(); } });
      addEventListener('keyup', e => { setKey(e.code, false); });
      document.querySelectorAll('#touch button').forEach(btn => { const code = btn.dataset.key; btn.addEventListener('pointerdown', e => { e.preventDefault(); setKey(code, true); btn.setPointerCapture(e.pointerId); }); ['pointerup','pointercancel','pointerleave'].forEach(type => btn.addEventListener(type, () => setKey(code, false))); });
      host.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; dragging = true; lastX = e.clientX; lastY = e.clientY; host.classList.add('dragging'); e.preventDefault(); });
      host.addEventListener('pointermove', e => { if (!dragging) return; const dx = e.clientX-lastX, dy = e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; flight.yaw -= dx*.0046; flight.pitch = clamp(flight.pitch + dy*.0032, -.6, .45); e.preventDefault(); });
      ['pointerup','pointercancel','pointerleave'].forEach(type => host.addEventListener(type, () => { dragging=false; host.classList.remove('dragging'); }));
      playBtn.addEventListener('click', async () => { if (!music.src) { status.textContent = 'add your track as Track4_MagicalRealm.mp3'; return; } if (music.paused) await music.play(); else music.pause(); });
      function resize() { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setPixelRatio(Math.min(devicePixelRatio||1, mobile?1.15:1.35)); renderer.setSize(innerWidth, innerHeight); }
      addEventListener('resize', resize);
      let last = performance.now();
      function animate(now) {
        const dt = Math.min((now-last)/1000, .04); last=now;
        const forward = keys.ArrowUp || keys.KeyW, back = keys.ArrowDown || keys.KeyS, left = keys.ArrowLeft || keys.KeyA, right = keys.ArrowRight || keys.KeyD;
        const thrust = forward ? 1 : back ? -0.55 : 0; const strafe = (right?1:0) - (left?1:0); const altitude = (keys.KeyE?1:0) - (keys.KeyQ?1:0);
        flight.vz += (-2.4 - flight.vz + thrust*6.6) * dt * 1.8; flight.vx += (strafe*5.2 - flight.vx) * dt * 2.2; flight.vy += (altitude*4.6 - flight.vy) * dt * 2.2;
        flight.x += flight.vx * dt * 34; flight.y = clamp(flight.y + flight.vy * dt * 34, 90, 2400); flight.z += flight.vz * dt * 34;
        triangle.position.set(flight.x, flight.y, flight.z); triangle.rotation.set(-flight.pitch, flight.yaw, -flight.vx*.025); aura.rotation.z += dt*.42;
        camera.position.lerp(new THREE.Vector3(flight.x, flight.y+250, flight.z+850), .08); camera.rotation.set(flight.pitch*.48, flight.yaw, 0); camera.lookAt(flight.x + Math.sin(flight.yaw)*850, flight.y + flight.pitch*500, flight.z - Math.cos(flight.yaw)*850);
        water.position.y = Math.sin(now*.00035)*1.8; islandGroup.rotation.y += dt*.0008; renderer.render(scene,camera); requestAnimationFrame(animate);
      }
      resize(); animate(last);
    })();
  </script>
</body>
</html>
