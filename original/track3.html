    });
    const ocean = new THREE.Mesh(oceanGeometry, waterMaterial);
    scene.add(ocean);

    const TOTAL_PARTICLE_COUNT = 6800;
    const ABOVE_WATER_PARTICLE_COUNT = 3400;
    const UNDERWATER_PARTICLE_COUNT = 6800;
    const PARTICLE_RANGE_X = 2100;
    const PARTICLE_RANGE_Y = 1500;
    const PARTICLE_RANGE_Z_FRONT = 3000;
    const PARTICLE_RANGE_Z_BACK = 900;
    const particlePositions = new Float32Array(TOTAL_PARTICLE_COUNT * 3);
    const particleDrift = new Float32Array(TOTAL_PARTICLE_COUNT);

    function resetParticle(i) {
      const index = i * 3;
      particlePositions[index] = randomBetween(-PARTICLE_RANGE_X, PARTICLE_RANGE_X);
      particlePositions[index + 1] = randomBetween(-PARTICLE_RANGE_Y * 0.8, PARTICLE_RANGE_Y);
      particlePositions[index + 2] = randomBetween(-PARTICLE_RANGE_Z_BACK, PARTICLE_RANGE_Z_FRONT);
      particleDrift[i] = randomBetween(0.5, 1.6);
    }

    for (let i = 0; i < TOTAL_PARTICLE_COUNT; i++) resetParticle(i);
    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute("position", new THREE.BufferAttribute(particlePositions, 3));
    particleGeometry.setDrawRange(0, ABOVE_WATER_PARTICLE_COUNT);
    const particleMaterial = new THREE.PointsMaterial({
      color: 0xe9fbff,
      size: 5.0,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.11,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
    particleSystem.frustumCulled = false;
    scene.add(particleSystem);

    function enterSunPortal() {
      if (state.portal.active || state.portal.exitCooldown > 0) return;
      state.portal.active = true;
      state.underwater = false;
      state.portal.targetYaw = 0;
      state.portal.targetPitch = 0;
      state.portal.yaw = 0;
      state.portal.pitch = 0;
    }

    function leaveSunPortal() {
      if (!state.portal.active) return;
      state.portal.active = false;
      state.portal.exitCooldown = 3.0;
      state.flight.x = WORLD_SUN_POSITION.x;
      state.flight.y = 430;
      state.flight.z = WORLD_SUN_POSITION.z - 2300;
      state.flight.vx = 0;
      state.flight.vy = 0;
      state.flight.vz = -260;
      state.portal.targetYaw = 0;
      state.portal.targetPitch = 0;
    }

    function updatePortalTrigger() {
      if (state.portal.active || state.portal.exitCooldown > 0) return;
      if (camera.position.distanceTo(WORLD_SUN_POSITION) <= SUN_PORTAL_RADIUS) enterSunPortal();
    }

    function updateSun() {
      sunPosition.copy(WORLD_SUN_POSITION);
      skyMaterial.uniforms.uSunPosition.value.copy(sunPosition);
      waterUniforms.uSunPosition.value.copy(sunPosition);
      dirLight.position.copy(sunPosition);
      underLight.position.copy(sunPosition);
      sunSprite.position.copy(sunPosition);
      mainRing.points.position.copy(sunPosition);
      outerRing.points.position.copy(sunPosition);
    }

    function updateSceneMusicResponse() {
      if (state.portal.active) return;
      const sunPulse = 1 + audioState.kick * 0.04 + responseState.bloom * 0.06 + Math.sin(state.waveClock * (0.36 + responseState.flow * 0.12)) * (0.012 + responseState.shimmer * 0.008);
      const sunScale = 2200 * sunPulse;
      sunSprite.scale.set(sunScale, sunScale, 1);
      sunSprite.material.opacity = 0.92 + responseState.shimmer * 0.04 + responseState.bloom * 0.04;
      sunSprite.material.rotation = Math.sin(state.waveClock * 0.18) * 0.018;
      skyMaterial.uniforms.uTop.value.copy(BASE_SKY_TOP);
      skyMaterial.uniforms.uMid.value.copy(BASE_SKY_MID);
      skyMaterial.uniforms.uBottom.value.copy(BASE_SKY_BOTTOM);
      waterUniforms.uDeep.value.copy(BASE_WATER_DEEP);
      waterUniforms.uMid.value.copy(BASE_WATER_MID);
      waterUniforms.uShallow.value.copy(BASE_WATER_SHALLOW);
      waterUniforms.uMist.value.copy(BASE_WATER_MIST);
      if (!state.underwater) {
        dirLight.intensity = 2.10 + responseState.bloom * 0.22 + responseState.shimmer * 0.05;
        hemiLight.intensity = 1.0 + responseState.flow * 0.05;
        scene.fog.color.set(0xc7d8e7);
        scene.fog.near = 9000;
        scene.fog.far = 56000;
      }
    }

    function updateRingInteraction(dt) {
      state.ring.touchEnergy *= Math.exp(-dt * 3.3);
      state.ring.touchPulse *= Math.exp(-dt * 4.4);
      state.ring.autoSpinX += dt * (0.085 + responseState.ring * 0.06 + responseState.shimmer * 0.012);
      if (!state.ring.dragActive) {
        state.ring.targetOffsetX *= Math.exp(-dt * 10.5);
        state.ring.targetOffsetY *= Math.exp(-dt * 10.0);
        state.ring.targetOffsetZ *= Math.exp(-dt * 11.0);
      }
      state.ring.targetOffsetX = clamp(state.ring.targetOffsetX, -0.35, 0.35);
      state.ring.targetOffsetY = clamp(state.ring.targetOffsetY, -0.16, 0.16);
      state.ring.targetOffsetZ = clamp(state.ring.targetOffsetZ, -0.14, 0.14);
      state.ring.offsetX = THREE.MathUtils.lerp(state.ring.offsetX, state.ring.targetOffsetX, Math.min(1, dt * 10.5));
      state.ring.offsetY = THREE.MathUtils.lerp(state.ring.offsetY, state.ring.targetOffsetY, Math.min(1, dt * 10.0));
      state.ring.offsetZ = THREE.MathUtils.lerp(state.ring.offsetZ, state.ring.targetOffsetZ, Math.min(1, dt * 11.0));
      mainRing.points.rotation.set(state.ring.autoSpinX + state.ring.offsetX, -0.12 + state.ring.offsetY, 0.10 + state.ring.offsetZ);
      outerRing.points.rotation.set(
        -state.ring.autoSpinX * 0.46 + state.ring.offsetX * 0.12,
        -0.215 + state.ring.offsetY * 0.28,
        0.035 + state.ring.offsetZ * 0.24
      );
    }

    function updateRingSystem(ringSystem, options) {
      const touchBoost = state.ring.touchEnergy * options.touchGain;
      const touchPulse = state.ring.touchPulse;
      const musicalBody = responseState.ring * 0.92 + responseState.flow * 0.28;
      const bassPulse = 1 + musicalBody * options.bassGain + touchBoost * 0.16;
      const shimmer = 1 + responseState.shimmer * options.highGain + touchBoost * 0.18;
      const time = state.waveClock * 0.24;
      const positions = ringSystem.geometry.attributes.position.array;

      for (let i = 0; i < ringSystem.particleCount; i++) {
        const index = i * 3;
        const angle = ringSystem.angles[i] + time * (0.035 + ringSystem.scales[i] * 0.018 + responseState.flow * 0.012);
        const radialWave = Math.sin(time * 2.0 + i * 0.041 + touchPulse * 2.0) * options.radialA + Math.cos(time * 1.32 + i * 0.017 + touchPulse * 1.4) * options.radialB + Math.sin(time * 2.7 + i * 0.014) * (responseState.ring * 14);
        const depthWave = Math.sin(time * 1.8 + i * 0.025 + touchPulse * 1.2) * options.depthA;
        const verticalWave = Math.sin(time * 2.2 + i * 0.063 + touchPulse * 1.4) * options.verticalA + Math.cos(time * 1.08 + i * 0.021 + touchPulse) * (options.verticalA * 0.48) + Math.sin(time * 3.0 + i * 0.013) * (responseState.shimmer * 4);
        const radiusY = (ringSystem.radiusY + ringSystem.radialOffsets[i] + radialWave + touchBoost * 10) * bassPulse;
        const radiusZ = (ringSystem.radiusZ + ringSystem.radialOffsets[i] * 0.42 + radialWave * 0.46) * bassPulse;
        positions[index] = ringSystem.depthOffsets[i] + depthWave * shimmer;
        positions[index + 1] = Math.cos(angle) * radiusY + verticalWave * 0.45;
        positions[index + 2] = Math.sin(angle) * radiusZ;
      }

      ringSystem.geometry.attributes.position.needsUpdate = true;
      ringSystem.points.position.copy(sunPosition);
      ringSystem.material.opacity = options.opacityBase + responseState.shimmer * options.opacityHigh + state.ring.touchEnergy * options.opacityTouch;
      ringSystem.material.size = options.sizeBase + (responseState.ring + responseState.flow * 0.4) * options.sizeBass + state.ring.touchEnergy * options.sizeTouch;
      ringSystem.material.needsUpdate = true;
    }

    function updateSunRings(dt) {
      if (state.portal.active) return;
      updateRingInteraction(dt);
      updateRingSystem(mainRing, {
        bassGain: 0.20,
        highGain: 0.22,
        touchGain: 1.0,
        radialA: 18 + responseState.ring * 12 + state.ring.touchEnergy * 17,
        radialB: 9 + responseState.shimmer * 6 + state.ring.touchEnergy * 6,
        depthA: 8 + responseState.flow * 5 + state.ring.touchEnergy * 7,
        verticalA: 6 + responseState.shimmer * 4 + state.ring.touchEnergy * 7,
        sizeBase: 18,
        sizeBass: 7,
        sizeTouch: 4,
        opacityBase: 0.56,
        opacityHigh: 0.16,
        opacityTouch: 0.14
      });
      updateRingSystem(outerRing, {
        bassGain: 0.15,
        highGain: 0.16,
        touchGain: 0.52,
        radialA: 13 + responseState.ring * 8 + state.ring.touchEnergy * 8,
        radialB: 6 + responseState.shimmer * 6 + state.ring.touchEnergy * 5,
        depthA: 5 + responseState.flow * 4 + state.ring.touchEnergy * 4,
        verticalA: 4 + responseState.shimmer * 3 + state.ring.touchEnergy * 5,
        sizeBase: 10,
        sizeBass: 4,
        sizeTouch: 2,
        opacityBase: 0.28,
        opacityHigh: 0.10,
        opacityTouch: 0.06
      });
    }

    function updateSkyShips() {
      if (state.portal.active) return;
      const time = state.waveClock;
      const travelParallaxX = state.flight.x * 0.010;
      const travelParallaxZ = state.flight.z * 0.010;
      const altitudeFollow = camera.position.y * 0.10;
      const ambientAltitudeFollow = camera.position.y * 0.08;
      const horizontalDance = responseState.flow * 1.9 + audioState.kick * 0.7;

      for (let i = 0; i < skyShips.length; i++) {
        const ship = skyShips[i];
        const formation = formationDefinitions[ship.formationIndex];
        const formationWaveX = Math.sin(time * (0.22 + responseState.flow * 0.14) + ship.formationIndex * 1.9 + ship.phase * 0.4) * (1150 + horizontalDance * 780) * ship.strafeBias;
        const formationWaveY = Math.cos(time * 0.09 + ship.formationIndex * 1.35) * (170 + audioState.kick * 50);
        const formationWaveZ = Math.sin(time * (0.08 + responseState.flow * 0.02) + ship.formationIndex * 0.95) * (820 + responseState.flow * 120);
        const localX = Math.sin(time * (0.58 + responseState.flow * 0.18) * ship.localOrbit + ship.phase) * (240 + horizontalDance * 150) * ship.strafeBias;
        const localY = Math.cos(time * (0.22 + responseState.shimmer * 0.06) * ship.localOrbit + ship.phase * 1.05) * 40;
        const localZ = Math.sin(time * (0.19 + responseState.flow * 0.04) * ship.localOrbit + ship.phase * 0.72) * 110;
        const twinkle = 1 + Math.sin(time * (ship.twinkleRate + responseState.shimmer * 2.2) + ship.phase * 1.7) * (ship.twinkleDepth + responseState.shimmer * 0.05);
        const pulse = 1 + audioState.kick * 0.22 * ship.pulseBias + responseState.flow * 0.20 + responseState.shimmer * 0.14 + Math.sin(time * (0.72 + ship.drift * 0.20) + ship.phase) * 0.08;
        const finalScale = ship.scale * pulse * twinkle;
        ship.sprite.position.set(camera.position.x + formation.anchor.x + formationWaveX + ship.slot.x + ship.slotJitter.x + localX - travelParallaxX, formation.anchor.y + altitudeFollow + formationWaveY + ship.slot.y + ship.slotJitter.y + localY, camera.position.z + formation.anchor.z + formationWaveZ + ship.slot.z + ship.slotJitter.z + localZ - travelParallaxZ);
        ship.sprite.scale.set(finalScale, finalScale, 1);
        ship.sprite.material.opacity = 0.66 + responseState.shimmer * 0.22 + responseState.flow * 0.12 + pulse * 0.10 + (twinkle - 1) * 0.55;
        ship.sprite.material.rotation = Math.sin(time * 0.14 + ship.phase) * 0.02;
      }

      for (let i = 0; i < ambientSkyShips.length; i++) {
        const ship = ambientSkyShips[i];
        const driftX = Math.sin(time * (0.26 + ship.drift * 0.08 + responseState.flow * 0.15) + ship.phase) * ship.swayX * (1 + horizontalDance * 0.55) * ship.strafeBias;
        const driftY = Math.cos(time * (0.06 + ship.drift * 0.04 + responseState.shimmer * 0.03) + ship.phase * 1.2) * ship.swayY;
        const driftZ = Math.sin(time * (0.05 + ship.drift * 0.03 + responseState.flow * 0.02) + ship.phase * 0.8) * ship.swayZ;
        const twinkle = 1 + Math.sin(time * (ship.twinkleRate + responseState.shimmer * 3.4) + ship.phase * 1.5) * (ship.twinkleDepth + responseState.shimmer * 0.06);
        const pulse = 1 + audioState.kick * 0.18 * ship.pulseBias + responseState.flow * 0.10 + responseState.shimmer * 0.14 + Math.sin(time * (0.55 + ship.drift * 0.18) + ship.phase) * 0.08;
        const finalScale = ship.scale * pulse * twinkle;
        ship.sprite.position.set(camera.position.x + ship.base.x + driftX - travelParallaxX * 0.82, ship.base.y + ship.lowBias + ambientAltitudeFollow + driftY, camera.position.z + ship.base.z + driftZ - travelParallaxZ * 0.82);
        ship.sprite.scale.set(finalScale, finalScale, 1);
        ship.sprite.material.opacity = 0.46 + responseState.shimmer * 0.22 + pulse * 0.10 + (twinkle - 1) * 0.72 + (ship.highBand ? 0.08 : 0);
        ship.sprite.material.rotation = Math.sin(time * 0.11 + ship.phase) * 0.018;
      }
    }

    function updateLandmark(dt) {
      if (state.portal.active) return;
      landmark.group.rotation.y = Math.sin(state.waveClock * 0.05) * 0.03;
      const portalFloat = Math.sin(state.waveClock * 0.32) * 6;
      landmark.portalGroup.position.y = 250 + portalFloat;
      landmark.portalRing.material.emissiveIntensity = 0.12 + responseState.ring * 0.25 + responseState.shimmer * 0.06;
      landmark.portalOuterHalo.material.opacity = 0.16 + responseState.ring * 0.10 + responseState.shimmer * 0.04;
      landmark.portalCore.material.opacity = 0.16 + responseState.ring * 0.12 + responseState.bloom * 0.05;
      landmark.portalGlow.material.opacity = 0.34 + responseState.ring * 0.14 + responseState.shimmer * 0.08;
      landmark.portalGlow.scale.setScalar(650 * (1 + responseState.ring * 0.07 + responseState.bloom * 0.03));
      landmark.portalGlow.material.rotation += dt * (0.06 + responseState.shimmer * 0.04);
      landmark.runeMeshes.forEach((rune, index) => {
        rune.material.opacity = 0.64 + responseState.shimmer * 0.30 + responseState.ring * 0.16;
        rune.position.z = rune.userData.baseZ + Math.sin(state.waveClock * 0.92 + rune.userData.phase) * 3;
        rune.rotation.z = rune.userData.baseRot + Math.sin(state.waveClock * 0.4 + index * 0.4) * 0.05;
      });
      landmark.archGlyphMeshes.forEach((glyph, index) => {
        glyph.material.opacity =
          0.42 +
          responseState.shimmer * 0.22 +
          responseState.ring * 0.13 +
          Math.sin(state.waveClock * 0.52 + glyph.userData.phase) * 0.045;
        glyph.position.z = glyph.userData.baseZ + Math.sin(state.waveClock * 0.34 + index * 0.5) * 2.2;
        glyph.rotation.z = glyph.userData.baseRot + Math.sin(state.waveClock * 0.28 + index * 0.27) * 0.018;
      });
      landmark.ruinGlyphMeshes.forEach((glyph, index) => {
        glyph.material.opacity =
          glyph.userData.baseOpacity +
          responseState.shimmer * 0.18 +
          responseState.ring * 0.10 +
          Math.sin(state.waveClock * 0.46 + glyph.userData.phase) * 0.035;
        glyph.position.z = glyph.userData.baseZ + Math.sin(state.waveClock * 0.38 + index * 0.7) * 2.6;
      });

      const beamPulse = 1 + responseState.bloom * 0.22 + responseState.shimmer * 0.12 + audioState.kick * 0.035 + Math.sin(state.waveClock * 0.48) * 0.04;
      landmark.beamGroup.rotation.y = state.waveClock * 0.045;
      landmark.beamCore.material.opacity = 0.48 + responseState.shimmer * 0.22 + responseState.bloom * 0.10;
      landmark.beamCross.material.opacity = 0.40 + responseState.shimmer * 0.18 + responseState.bloom * 0.09;
      landmark.beamMist.material.opacity = 0.24 + responseState.bloom * 0.12 + responseState.shimmer * 0.08;
      landmark.beamMist.scale.x = 1320 * beamPulse;

      const beamPositions = landmark.beamParticleGeometry.attributes.position.array;
      const beamTravel = landmark.beamHeight - 120;
      for (let i = 0; i < BEAM_SPIRAL_PARTICLE_COUNT; i++) {
        const index = i * 3;
        const direction = landmark.beamParticleDirections[i];
        const yTravel =
          ((landmark.beamParticleHeights[i] - 60 + state.waveClock * 62 * landmark.beamParticleSpeeds[i] * direction) % beamTravel + beamTravel) %
          beamTravel;
        const y = 60 + yTravel;
        const angle =
          landmark.beamParticlePhases[i] +
          state.waveClock * (0.74 + landmark.beamParticleSpeeds[i] * 0.95) * direction +
          Math.sin(state.waveClock * 0.32 + i * 0.19) * 0.28;
        const radius =
          landmark.beamParticleRadii[i] *
          (1 + responseState.shimmer * 0.10 + responseState.bloom * 0.08 + Math.sin(state.waveClock * 0.55 + i) * 0.045);

        beamPositions[index] = Math.cos(angle) * radius;
        beamPositions[index + 1] = y;
        beamPositions[index + 2] = Math.sin(angle) * radius * 0.72;
      }
      landmark.beamParticleGeometry.attributes.position.needsUpdate = true;
      landmark.beamParticles.material.opacity = 0.42 + responseState.shimmer * 0.18 + responseState.bloom * 0.12;
      landmark.beamParticles.material.size = 18 + responseState.shimmer * 10 + responseState.bloom * 5;
    }

    function updatePortalWorld(dt) {
      portalWorld.group.visible = state.portal.active;
      if (!state.portal.active) return;

      portalWorld.dome.position.copy(camera.position);
      portalWorld.particles.position.copy(camera.position);
      portalWorld.warpStars.position.copy(camera.position);
      portalWorld.warpStars.quaternion.copy(camera.quaternion);
      portalWorld.warpStreaks.position.copy(camera.position);
      portalWorld.warpStreaks.quaternion.copy(camera.quaternion);
      portalWorld.coreGroup.position.set(camera.position.x, camera.position.y + Math.sin(state.waveClock * 0.42) * 90, camera.position.z + 8200);
      portalWorld.coreGroup.rotation.y += dt * (0.06 + responseState.flow * 0.04);

      portalWorld.coreSphere.scale.setScalar(1 + responseState.bloom * 0.07);
      const musicDrive = responseState.ring + responseState.flow * 0.55 + responseState.bloom * 0.70 + audioState.kick * 1.15;
      const ringBreath = Math.sin(state.waveClock * (0.42 + responseState.flow * 0.22)) * (0.018 + responseState.ring * 0.030);

      portalWorld.ringA.rotation.z += dt * (0.40 + responseState.flow * 0.86 + audioState.kick * 1.25);
      portalWorld.ringA.rotation.y += dt * (0.14 + responseState.shimmer * 0.38 + responseState.bloom * 0.24);
      portalWorld.ringB.rotation.x -= dt * (0.28 + responseState.flow * 0.62 + audioState.kick * 0.95);
      portalWorld.ringB.rotation.z -= dt * (0.36 + responseState.shimmer * 0.64 + responseState.bloom * 0.34);
      portalWorld.ringC.rotation.x += dt * (0.22 + responseState.ring * 0.72 + audioState.kick * 0.86);
      portalWorld.ringC.rotation.y -= dt * (0.30 + responseState.shimmer * 0.54 + audioState.mid * 0.42);
      portalWorld.ringC.rotation.z += dt * (0.26 + audioState.kick * 1.05 + responseState.bloom * 0.46);

      portalWorld.ringA.material.opacity = 0.36 + musicDrive * 0.28 + responseState.shimmer * 0.16;
      portalWorld.ringB.material.opacity = 0.30 + musicDrive * 0.22 + responseState.shimmer * 0.24;
      portalWorld.ringC.material.opacity = 0.24 + musicDrive * 0.20 + responseState.bloom * 0.18;
      portalWorld.ringA.scale.setScalar(1 + musicDrive * 0.46 + ringBreath);
      portalWorld.ringB.scale.setScalar(1 + responseState.flow * 0.48 + audioState.kick * 0.42 + responseState.bloom * 0.24 - ringBreath * 0.6);
      portalWorld.ringC.scale.setScalar(1 + responseState.shimmer * 0.50 + responseState.bloom * 0.34 + audioState.kick * 0.30 + ringBreath * 0.8);
      portalWorld.coreGlow.material.opacity = 0.44 + responseState.bloom * 0.42 + responseState.shimmer * 0.22 + audioState.kick * 0.22;
      portalWorld.coreGlow.scale.setScalar(3800 * (1 + responseState.bloom * 0.26 + audioState.kick * 0.20 + responseState.ring * 0.12));

      portalWorld.starTetrahedron.rotation.x += dt * (0.24 + responseState.flow * 0.18);
      portalWorld.starTetrahedron.rotation.y += dt * (0.36 + responseState.shimmer * 0.20);
      portalWorld.starTetrahedron.rotation.z -= dt * (0.18 + audioState.kick * 0.12);
      const starScale = 1 + responseState.bloom * 0.10 + Math.sin(state.waveClock * 1.2) * 0.035;
      portalWorld.starTetrahedron.scale.setScalar(starScale);
      portalWorld.starTetrahedron.children.forEach((child, index) => {
        if (child.isSprite) {
          child.material.opacity = 0.42 + responseState.bloom * 0.22 + responseState.shimmer * 0.18;
          child.scale.setScalar(920 * (1 + responseState.bloom * 0.12 + Math.sin(state.waveClock * 0.9) * 0.025));
        } else {
          child.material.opacity = (index < 3 ? 0.76 : 0.58) + responseState.shimmer * 0.24 + responseState.bloom * 0.20;
        }
      });

      const positions = portalWorld.particleGeometry.attributes.position.array;
      const vxFlow = state.flight.vx * dt;
      const vyFlow = state.flight.vy * dt;
      const vzFlow = state.flight.vz * dt;
      const warpSpeed = state.moveEnergy * (260 + responseState.flow * 180 + audioState.kick * 120);
      for (let i = 0; i < PORTAL_PARTICLE_COUNT; i++) {
        const index = i * 3;
        const drift = portalWorld.portalDrift[i];
        positions[index] -= vxFlow * 0.16;
        positions[index + 1] -= vyFlow * 0.10;
        positions[index + 2] -= vzFlow * 0.34;
        positions[index] += Math.sin(state.waveClock * (0.42 + drift * 0.12) + i * 0.35) * dt * (18 + responseState.flow * 22) * drift;
        positions[index + 1] += Math.cos(state.waveClock * (0.36 + drift * 0.09) + i * 0.22) * dt * (12 + responseState.shimmer * 16) * drift;
        positions[index + 2] += Math.sin(state.waveClock * (0.18 + drift * 0.08) + i * 0.16) * dt * (9 + responseState.flow * 10);
        positions[index + 2] -= dt * warpSpeed * drift;
        positions[index] = wrapValue(positions[index], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
        positions[index + 1] = wrapValue(positions[index + 1], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
        positions[index + 2] = wrapValue(positions[index + 2], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
      }
      portalWorld.particleGeometry.attributes.position.needsUpdate = true;
      portalWorld.particleMaterial.opacity = 0.34 + responseState.shimmer * 0.24 + responseState.bloom * 0.10 + state.moveEnergy * 0.12;
      portalWorld.particleMaterial.size = 14 + responseState.shimmer * 8 + state.moveEnergy * 10;

      const warpPositions = portalWorld.warpStarGeometry.attributes.position.array;
      const warpDirection = state.keys.forward ? -1 : (state.keys.back ? 1 : 0);
      const warpAmount = Math.abs(warpDirection);
      const strafeDirection = state.keys.right ? 1 : (state.keys.left ? -1 : 0);
      const strafeAmount = Math.abs(strafeDirection);
      const warpRush = warpDirection * (3400 + state.moveEnergy * 6800 + responseState.flow * 1100 + audioState.kick * 800);
      const sideWarp = state.flight.vx * dt * 1.4 + strafeDirection * dt * (3200 + state.moveEnergy * 3000);
      const liftWarp = state.flight.vy * dt * 0.8;
      for (let i = 0; i < PORTAL_WARP_STAR_COUNT; i++) {
        const index = i * 3;
        const drift = portalWorld.warpStarDrift[i];
        warpPositions[index] -= sideWarp * drift;
        warpPositions[index + 1] -= liftWarp * drift;
        warpPositions[index + 2] -= dt * warpRush * drift;
        warpPositions[index] += Math.sin(state.waveClock * 0.28 + i * 0.13) * dt * 18 * drift;
        warpPositions[index + 1] += Math.cos(state.waveClock * 0.24 + i * 0.17) * dt * 14 * drift;
        warpPositions[index] = wrapValue(warpPositions[index], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
        warpPositions[index + 1] = wrapValue(warpPositions[index + 1], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
        warpPositions[index + 2] = wrapValue(warpPositions[index + 2], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
      }
      portalWorld.warpStarGeometry.attributes.position.needsUpdate = true;
      portalWorld.warpStarMaterial.opacity = 0.66 + responseState.shimmer * 0.20 + warpAmount * 0.30 + strafeAmount * 0.16 + audioState.kick * 0.10;
      portalWorld.warpStarMaterial.size = 16 + responseState.shimmer * 7 + warpAmount * 34 + strafeAmount * 12;

      const streakPositions = portalWorld.warpStreakGeometry.attributes.position.array;
      const streakRush = warpDirection * (7600 + state.moveEnergy * 9400 + responseState.flow * 1700 + audioState.kick * 980);
      const lateralRush = strafeDirection * (5200 + state.moveEnergy * 5200 + responseState.flow * 900);
      const trailLength = 560 + warpAmount * (2900 + state.moveEnergy * 1800 + audioState.kick * 480) + strafeAmount * 1500;
      for (let i = 0; i < PORTAL_WARP_STREAK_COUNT; i++) {
        const index = i * 6;
        const drift = portalWorld.warpStreakDrift[i];
        const sideSway = Math.sin(state.waveClock * 0.24 + i * 0.19) * dt * 24 * drift;
        const liftSway = Math.cos(state.waveClock * 0.20 + i * 0.23) * dt * 18 * drift;
        streakPositions[index] -= (sideWarp + lateralRush * dt) * drift + sideSway;
        streakPositions[index + 1] -= liftWarp * drift + liftSway;
        streakPositions[index + 2] -= dt * streakRush * drift;
        streakPositions[index] = wrapValue(streakPositions[index], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
        streakPositions[index + 1] = wrapValue(streakPositions[index + 1], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
        streakPositions[index + 2] = wrapValue(streakPositions[index + 2], -PORTAL_PARTICLE_RANGE, PORTAL_PARTICLE_RANGE);
        streakPositions[index + 3] = streakPositions[index];
        streakPositions[index + 4] = streakPositions[index + 1];
        streakPositions[index + 5] = streakPositions[index + 2] + trailLength * drift * (warpDirection || 1);
        streakPositions[index + 3] += trailLength * drift * strafeDirection * 0.36;
      }
      portalWorld.warpStreakGeometry.attributes.position.needsUpdate = true;
      portalWorld.warpStreakMaterial.opacity = 0.05 + warpAmount * 0.50 + strafeAmount * 0.28 + responseState.shimmer * 0.12 + audioState.kick * 0.08;

      for (let i = 0; i < portalWorld.orbs.length; i++) {
        const orb = portalWorld.orbs[i];
        const angle = state.waveClock * orb.speed + orb.phase;
        const lateral = Math.cos(angle) * orb.radius;
        const vertical = Math.sin(angle * 1.3) * (orb.wobble + responseState.flow * 120);
        const depth = orb.depth + Math.sin(angle * 0.82) * 420;
        orb.sprite.position.set(camera.position.x + lateral, camera.position.y + orb.height + vertical, camera.position.z + depth);
        const pulse = 1 + responseState.shimmer * 0.25 + responseState.flow * 0.12 + Math.sin(state.waveClock * (1.0 + orb.speed) + orb.phase) * 0.16;
        const scale = orb.scale * pulse;
        orb.sprite.scale.set(scale, scale, 1);
        orb.sprite.material.opacity = 0.22 + responseState.shimmer * 0.30 + responseState.bloom * 0.12 + Math.sin(state.waveClock * (1.2 + orb.speed) + orb.phase) * 0.10;
        orb.sprite.material.rotation = Math.sin(state.waveClock * 0.22 + orb.phase) * 0.08;
      }
    }

    function getHeldSpeed(holdTime) {
      const ramp = 1 - Math.exp(-holdTime * AXIS_ACCEL_CURVE);
      return AXIS_BASE_SPEED + (AXIS_MAX_SPEED - AXIS_BASE_SPEED) * saturate(ramp);
    }

    function updateHoldTimer(dt, input, posKey, negKey) {
      if (input > 0) {
        state.holds[posKey] += dt;
        state.holds[negKey] = 0;
      } else if (input < 0) {
        state.holds[negKey] += dt;
        state.holds[posKey] = 0;
      } else {
        state.holds[posKey] = 0;
        state.holds[negKey] = 0;
      }
    }

    function axisTargetSpeed(input, posKey, negKey, multiplier = 1) {
      if (input > 0) return getHeldSpeed(state.holds[posKey]) * multiplier;
      if (input < 0) return -getHeldSpeed(state.holds[negKey]) * multiplier;
      return 0;
    }

    function updateFlight(dt) {
      const strafeInput = (state.keys.right ? 1 : 0) - (state.keys.left ? 1 : 0);
      const forwardInput = (state.keys.forward ? 1 : 0) - (state.keys.back ? 1 : 0);
      const altitudeInput = (state.keys.up ? 1 : 0) - (state.keys.down ? 1 : 0);
      updateHoldTimer(dt, strafeInput, "xPos", "xNeg");
      updateHoldTimer(dt, altitudeInput, "yPos", "yNeg");
      updateHoldTimer(dt, forwardInput, "zPos", "zNeg");
      state.flight.targetVx = axisTargetSpeed(strafeInput, "xPos", "xNeg", STRAFE_SPEED_MULTIPLIER);
      state.flight.targetVy = axisTargetSpeed(altitudeInput, "yPos", "yNeg", 1);
      state.flight.targetVz = axisTargetSpeed(forwardInput, "zPos", "zNeg", FORWARD_SPEED_MULTIPLIER);

      if (state.portal.active) {
        const forwardSpeed = state.flight.targetVz;
        const strafeSpeed = state.flight.targetVx;
        const yawSin = Math.sin(state.portal.yaw);
        const yawCos = Math.cos(state.portal.yaw);
        state.flight.targetVx = yawSin * forwardSpeed + yawCos * strafeSpeed;
        state.flight.targetVz = yawCos * forwardSpeed - yawSin * strafeSpeed;
      }

      state.flight.vx = THREE.MathUtils.lerp(state.flight.vx, state.flight.targetVx, Math.min(1, dt * 3.6));
      state.flight.vy = THREE.MathUtils.lerp(state.flight.vy, state.flight.targetVy, Math.min(1, dt * 3.6));
      state.flight.vz = THREE.MathUtils.lerp(state.flight.vz, state.flight.targetVz, Math.min(1, dt * 3.6));
      state.flight.x += state.flight.vx * dt;
      state.flight.y += state.flight.vy * dt;
      state.flight.z += state.flight.vz * dt;
      state.flight.x = clamp(state.flight.x, -150000, 150000);
      state.flight.y = clamp(state.flight.y, MIN_ALTITUDE, MAX_ALTITUDE);
      state.moveEnergy = Math.min(1, (Math.abs(state.flight.vx) + Math.abs(state.flight.vy) + Math.abs(state.flight.vz)) / (AXIS_MAX_SPEED * 2.4));
      state.flight.bobPhase += dt * (0.42 + state.moveEnergy * 0.26 + audioState.kick * 0.20 + responseState.flow * 0.08);
    }

    function updateUnderwaterState() {
      if (state.portal.active) {
        state.underwater = false;
        sky.visible = false;
        ocean.visible = false;
        sunSprite.visible = false;
        mainRing.points.visible = false;
        outerRing.points.visible = false;
        shipGroup.visible = false;
        landmark.group.visible = false;
        particleSystem.visible = false;
        renderer.setClearColor(0x02030a, 1);
        scene.fog.color.set(0x05060c);
        scene.fog.near = 2000;
        scene.fog.far = 32000;
        dirLight.intensity = 0.28 + responseState.bloom * 0.12;
        hemiLight.intensity = 0.18 + responseState.shimmer * 0.08;
        underLight.intensity = 0.0;
        return;
      }

      state.underwater = camera.position.y < WATER_LEVEL - 6;
      const depth = saturate((WATER_LEVEL - camera.position.y) / 720);
      skyMaterial.uniforms.uUnderwater.value = state.underwater ? 1 : 0;
      skyMaterial.uniforms.uUnderwaterDepth.value = depth;
      waterUniforms.uUnderwater.value = state.underwater ? 1 : 0;
      waterUniforms.uUnderwaterDepth.value = depth;
      sky.visible = true;
      ocean.visible = true;
      particleSystem.visible = true;
      shipGroup.visible = !state.underwater;
      landmark.group.visible = !state.underwater;
      sunSprite.visible = !state.underwater;
      mainRing.points.visible = !state.underwater;
      outerRing.points.visible = !state.underwater;

      if (state.underwater) {
        renderer.setClearColor(0x2a6772, 1);
        scene.fog.color.set(0x5c939a);
        scene.fog.near = 900;
        scene.fog.far = 12000;
        dirLight.intensity = 0.45;
        hemiLight.intensity = 0.48;
        underLight.intensity = 1.45 - depth * 0.20;
      } else {
        renderer.setClearColor(0x82a6cb, 1);
        scene.fog.color.set(0xc7d8e7);
        scene.fog.near = 9000;
        scene.fog.far = 56000;
        dirLight.intensity = 2.2;
        hemiLight.intensity = 1.0;
        underLight.intensity = 0.0;
      }
    }

    function updateCamera() {
      const y = state.flight.y;
      const aboveFactor = saturate((y - 430) / (MAX_ALTITUDE - 430));
      const belowFactor = saturate((WATER_LEVEL - y) / Math.abs(MIN_ALTITUDE));
      camera.position.set(state.flight.x, y, state.flight.z);

      if (state.portal.active) {
        const lookDirection = new THREE.Vector3(
          Math.sin(state.portal.yaw) * Math.cos(state.portal.pitch),
          Math.sin(state.portal.pitch),
          Math.cos(state.portal.yaw) * Math.cos(state.portal.pitch)
        );
        camera.lookAt(camera.position.clone().add(lookDirection.multiplyScalar(5600)));
      } else if (camera.position.y >= WATER_LEVEL) {
        const lookDownAmount = 360 + aboveFactor * 4200;
        const lookForward = 5600 + aboveFactor * 2600;
        const baseLookY = Math.max(WATER_LEVEL - 520, camera.position.y - lookDownAmount);
        const lookDirection = new THREE.Vector3(
          Math.sin(state.flight.yaw) * Math.cos(state.flight.pitch),
          (baseLookY - camera.position.y) / lookForward + state.flight.pitch * 0.36,
          Math.cos(state.flight.yaw) * Math.cos(state.flight.pitch)
        ).normalize();
        camera.lookAt(camera.position.clone().add(lookDirection.multiplyScalar(lookForward)));
      } else {
        const lookUpAmount = 220 + belowFactor * 1250;
        const lookForward = 3000 + (1 - belowFactor) * 600;
        const lookDirection = new THREE.Vector3(
          Math.sin(state.flight.yaw) * Math.cos(state.flight.pitch),
          (lookUpAmount / lookForward) + state.flight.pitch * 0.42,
          Math.cos(state.flight.yaw) * Math.cos(state.flight.pitch)
        ).normalize();
        camera.lookAt(camera.position.clone().add(lookDirection.multiplyScalar(lookForward)));
      }
      sky.position.copy(camera.position);
    }

    function updateOcean(dt) {
      const kick = saturate(audioState.kick);
      const idleBlend = 1 - state.moveEnergy;
      state.waveClock += dt * (BASE_WAVE_TIME_SCALE + idleBlend * IDLE_WAVE_BOOST + kick * 1.45);
      if (state.portal.active) return;
      ocean.position.x = state.flight.x;
      ocean.position.z = state.flight.z;
      waterUniforms.uOrigin.value.set(state.flight.x, state.flight.z);
      waterUniforms.uTime.value = state.waveClock;
      waterUniforms.uWaveScale.value = WAVE_SCALE * (1 + kick * 1.18 + Math.sin(state.waveClock * 0.62) * 0.012);
      waterUniforms.uWaveSpacing.value = WAVE_SPACING * (1 - kick * 0.032);
    }

    function updateParticleField(dt) {
      if (state.portal.active) return;
      particleGeometry.setDrawRange(0, state.underwater ? UNDERWATER_PARTICLE_COUNT : ABOVE_WATER_PARTICLE_COUNT);
      const speedBoost = 1 + responseState.shimmer * 0.7;
      const vzFlow = state.flight.vz * dt;
      const vxFlow = state.flight.vx * dt;
      const vyFlow = state.flight.vy * dt;
      for (let i = 0; i < TOTAL_PARTICLE_COUNT; i++) {
        const index = i * 3;
        const drift = particleDrift[i];
        particlePositions[index] -= vxFlow * 0.70;
        particlePositions[index + 1] -= vyFlow * 0.34;
        particlePositions[index + 2] -= vzFlow * 1.12;
        particlePositions[index] += Math.sin(state.waveClock * 0.68 + i * 0.37) * dt * 6.2 * drift * speedBoost;
        particlePositions[index + 1] += Math.cos(state.waveClock * 0.52 + i * 0.19) * dt * 2.1 * drift * speedBoost;
        particlePositions[index + 2] -= dt * (22 + drift * 10) * speedBoost;
        particlePositions[index] = wrapValue(particlePositions[index], -PARTICLE_RANGE_X, PARTICLE_RANGE_X);
        particlePositions[index + 1] = wrapValue(particlePositions[index + 1], -PARTICLE_RANGE_Y * 0.8, PARTICLE_RANGE_Y);
        particlePositions[index + 2] = wrapValue(particlePositions[index + 2], -PARTICLE_RANGE_Z_BACK, PARTICLE_RANGE_Z_FRONT);
      }
      particleGeometry.attributes.position.needsUpdate = true;
      particleSystem.position.copy(camera.position);
      particleSystem.position.y += state.underwater ? 10 : 60;
      if (state.underwater) {
        particleMaterial.color.set(0xdffcff);
        particleMaterial.opacity = 0.22 + responseState.shimmer * 0.05;
        particleMaterial.size = 4.6 + responseState.shimmer * 0.8;
      } else {
        particleMaterial.color.setRGB(0.96, 0.99, 1.0);
        particleMaterial.opacity = 0.10 + responseState.shimmer * 0.07;
        particleMaterial.size = 3.4 + responseState.shimmer * 1.8;
      }
      particleMaterial.needsUpdate = true;
    }

    function resize() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      camera.aspect = state.width / state.height;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(state.width, state.height);
    }

    function focusScene() {
      host.focus({ preventScroll: true });
      renderer.domElement.focus({ preventScroll: true });
    }

    function resetMovementKeys() {
      state.keys.left = false;
      state.keys.right = false;
      state.keys.forward = false;
      state.keys.back = false;
      state.keys.down = false;
      state.keys.up = false;
    }

    function setKeyState(event, isDown) {
      let handled = false;
      switch (event.code) {
        case "ArrowLeft": state.keys.left = isDown; handled = true; break;
        case "ArrowRight": state.keys.right = isDown; handled = true; break;
        case "ArrowUp": state.keys.forward = isDown; handled = true; break;
        case "ArrowDown": state.keys.back = isDown; handled = true; break;
        case "KeyQ": state.keys.down = isDown; handled = true; break;
        case "KeyE": state.keys.up = isDown; handled = true; break;
        case "Space":
          if (isDown) togglePlayback();
          handled = true;
          break;
      }
      if (handled) {
        if (isDown && event.code !== "Space" && !state.musicStarted) startAudio();
        event.preventDefault();
      }
    }

    function clickPortalExit(event) {
      if (!state.portal.active) return false;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(portalWorld.starTetrahedron.userData.clickables, true);
      if (hits.length) {
        leaveSunPortal();
        return true;
      }
      return false;
    }

    function animate(timestamp) {
      if (!state.lastTime) state.lastTime = timestamp;
      const dt = Math.min((timestamp - state.lastTime) / 1000, 0.033);
      state.lastTime = timestamp;
      updateAudio();
      updateElegantResponse(dt);
      updateFlight(dt);
      updateCamera();
      updatePortalTrigger();
      updateSun();
      updateSceneMusicResponse();
      updateUnderwaterState();
      updateOcean(dt);
      updateParticleField(dt);
      updateSkyShips();
      updateSunRings(dt);
      updateLandmark(dt);
      updatePortalWorld(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function onPointerDown(event) {
      if (event.target.closest("button")) return;
      focusScene();
      if (clickPortalExit(event)) return;
      state.pointerActive = true;
      state.pointerId = event.pointerId;
      state.lastPointerX = event.clientX;
      state.lastPointerY = event.clientY;
      if (!state.portal.active) {
        state.ring.dragActive = true;
        state.ring.touchEnergy = 1;
        state.ring.touchPulse = 1;
      }
      host.classList.add("dragging");
      renderer.domElement.setPointerCapture(event.pointerId);
    }

    function onPointerMove(event) {
      if (!state.pointerActive || event.pointerId !== state.pointerId) return;
      const dx = event.clientX - state.lastPointerX;
      const dy = event.clientY - state.lastPointerY;
      state.lastPointerX = event.clientX;
      state.lastPointerY = event.clientY;
      if (state.portal.active) {
        state.portal.targetYaw -= dx * 0.0046;
        state.portal.targetPitch = clamp(state.portal.targetPitch + dy * 0.0038, -Math.PI * 0.48, Math.PI * 0.48);
      } else {
        state.flight.targetYaw -= dx * 0.0042;
        state.flight.targetPitch = clamp(state.flight.targetPitch + dy * 0.0033, -Math.PI * 0.48, Math.PI * 0.38);

        state.ring.targetOffsetX += dx * 0.006;
        state.ring.targetOffsetY += dx * 0.0012;
        state.ring.targetOffsetZ += dy * 0.0013;
        const touchAmount = Math.sqrt(dx * dx + dy * dy);
        state.ring.touchEnergy = clamp(state.ring.touchEnergy + touchAmount * 0.008, 0, 2.0);
        state.ring.touchPulse = clamp(state.ring.touchPulse + touchAmount * 0.010, 0, 2.3);
      }
    }

    function endPointer(event) {
      if (state.pointerId !== null && event.pointerId !== state.pointerId) return;
      state.pointerActive = false;
      state.pointerId = null;
      state.ring.dragActive = false;
      host.classList.remove("dragging");
    }

    playPauseBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      togglePlayback();
    });
    music.addEventListener("play", syncPlayPauseLabel);
    music.addEventListener("pause", syncPlayPauseLabel);
    window.addEventListener("resize", resize);
    window.addEventListener("blur", resetMovementKeys);
    document.addEventListener("keydown", (event) => setKeyState(event, true), { passive: false });
    document.addEventListener("keyup", (event) => setKeyState(event, false), { passive: false });
    renderer.domElement.addEventListener("pointerdown", onPointerDown, { passive: true });
    renderer.domElement.addEventListener("pointermove", onPointerMove, { passive: true });
    renderer.domElement.addEventListener("pointerup", endPointer, { passive: true });
    renderer.domElement.addEventListener("pointercancel", endPointer, { passive: true });
    window.addEventListener("touchstart", () => {
      focusScene();
    }, { passive: true });
    window.addEventListener("mousedown", focusScene, { passive: true });
    window.addEventListener("load", () => {
      focusScene();
      syncPlayPauseLabel();
    });

    resize();
    syncPlayPauseLabel();
    focusScene();
    animate(0);
  </script>
</body>
</html>
