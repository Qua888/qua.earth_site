<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qua — Ocean Flight</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, serif;
      touch-action: none;
    }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
      outline: none;
    }

    #scene.dragging { cursor: grabbing; }

    #nav {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: linear-gradient(to bottom, rgba(10, 12, 22, 0.94), rgba(0, 0, 0, 0.96));
      color: #fff;
      font-family: Georgia, serif;
      letter-spacing: 2px;
      font-size: 12px;
      padding: 10px 16px;
      cursor: pointer;
    }

    button:hover { border-color: rgba(120, 220, 255, 0.40); }

    #hint {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 20;
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      letter-spacing: 1px;
      line-height: 1.45;
      text-align: right;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      user-select: none;
      white-space: pre-line;
    }

    @media (max-width: 768px) {
      #hint {
        top: 10px;
        right: 10px;
        font-size: 10px;
      }

      #nav {
        bottom: 14px;
        gap: 8px;
      }

      button {
        font-size: 11px;
        padding: 9px 14px;
      }
    }
  </style>
</head>
<body>
  <div id="scene" tabindex="0"></div>

  <div id="nav">
    <button type="button" onclick="location.href='index.html'">Return</button>
    <button type="button" onclick="location.href='track2.html'">Back</button>
    <button id="playPauseBtn" type="button">Play</button>
    <button type="button" onclick="location.href='track4.html'">Next</button>
  </div>

  <div id="hint">drag = look around
↑ ↓ = forward / back
← → = drift
Q / E = altitude
drag also disturbs sun ring
click white star = return</div>

  <audio id="music" loop playsinline preload="auto">
    <source src="aquariantransmissions.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    const host = document.getElementById("scene");
    const music = document.getElementById("music");
    const playPauseBtn = document.getElementById("playPauseBtn");

    const WATER_LEVEL = 0;
    const MIN_ALTITUDE = -1800;
    const MAX_ALTITUDE = 10080;
    const AXIS_BASE_SPEED = 280;
    const AXIS_MAX_SPEED = 2800;
    const AXIS_ACCEL_CURVE = 4.4;
    const STRAFE_SPEED_MULTIPLIER = 0.123;
    const FORWARD_SPEED_MULTIPLIER = 0.235;
    const WAVE_SCALE = 2.8;
    const WAVE_SPACING = 1.68;
    const BASE_WAVE_TIME_SCALE = 1.28;
    const IDLE_WAVE_BOOST = 1.28;

    const WORLD_SUN_POSITION = new THREE.Vector3(0, 5200, 13200);
    const WORLD_ISLAND_POSITION = new THREE.Vector3(0, -120, 12950);
    const SUN_PORTAL_RADIUS = 1500;
    const PORTAL_PARTICLE_COUNT = 2800;
    const PORTAL_WARP_STAR_COUNT = 2200;
    const PORTAL_WARP_STREAK_COUNT = 900;
    const PORTAL_ORB_COUNT = 242;
    const PORTAL_PARTICLE_RANGE = 9000;
    const BEAM_SPIRAL_PARTICLE_COUNT = 0;

    const BASE_SKY_TOP = new THREE.Color(0x4e7fb5);
    const BASE_SKY_MID = new THREE.Color(0x97a7d1);
    const BASE_SKY_BOTTOM = new THREE.Color(0xffdfc7);
    const BASE_WATER_DEEP = new THREE.Color(0x235a84);
    const BASE_WATER_MID = new THREE.Color(0x3d7aa8);
    const BASE_WATER_SHALLOW = new THREE.Color(0x56a2d1);
    const BASE_WATER_MIST = new THREE.Color(0xc8d9e7);

    const state = {
      width: window.innerWidth,
      height: window.innerHeight,
      lastTime: 0,
      waveClock: 0,
      pointerActive: false,
      pointerId: null,
      lastPointerX: 0,
      lastPointerY: 0,
      underwater: false,
      moveEnergy: 0,
      keys: { left: false, right: false, forward: false, back: false, down: false, up: false },
      holds: { xPos: 0, xNeg: 0, yPos: 0, yNeg: 0, zPos: 0, zNeg: 0 },
      flight: {
        x: 0,
        y: 430,
        z: 0,
        vx: 0,
        vy: 0,
        vz: 0,
        targetVx: 0,
        targetVy: 0,
        targetVz: 0,
        yaw: 0,
        targetYaw: 0,
        pitch: -0.28,
        targetPitch: -0.28,
        bobPhase: 0
      },
      ring: {
        dragActive: false,
        offsetX: 0,
        offsetY: 0,
        offsetZ: 0,
        targetOffsetX: 0,
        targetOffsetY: 0,
        targetOffsetZ: 0,
        touchEnergy: 0,
        touchPulse: 0,
        autoSpinX: 0
      },
      portal: {
        active: false,
        blend: 0,
        yaw: 0,
        pitch: 0,
        targetYaw: 0,
        targetPitch: 0,
        exitCooldown: 0
      },
      musicStarted: false,
      autoplayBlocked: false
    };

    let audioCtx = null;
    let analyser = null;
    let mediaSource = null;
    let audioData = null;

    const audioState = {
      sub: 0,
      bass: 0,
      low: 0,
      mid: 0,
      high: 0,
      air: 0,
      overall: 0,
      kick: 0,
      kickBody: 0,
      kickTransient: 0,
      prevKickEnergy: 0
    };

    const responseState = { flow: 0, shimmer: 0, bloom: 0, ring: 0 };

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function saturate(value) { return clamp(value, 0, 1); }
    function randomBetween(min, max) { return min + Math.random() * (max - min); }
    function wrapValue(value, min, max) {
      const range = max - min;
      let wrapped = value;
      while (wrapped < min) wrapped += range;
      while (wrapped > max) wrapped -= range;
      return wrapped;
    }

    function ensureAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.80;
      mediaSource = audioCtx.createMediaElementSource(music);
      mediaSource.connect(analyser);
      analyser.connect(audioCtx.destination);
      audioData = new Uint8Array(analyser.frequencyBinCount);
      music.volume = 0.95;
    }

    async function tryStartAudio() {
      try {
        ensureAudio();
        if (audioCtx.state === "suspended") await audioCtx.resume();
        await music.play();
        state.musicStarted = true;
        state.autoplayBlocked = false;
      } catch (_) {
        state.autoplayBlocked = true;
      }
      syncPlayPauseLabel();
    }

    function startAudio() { tryStartAudio().catch(() => {}); }
    function syncPlayPauseLabel() { playPauseBtn.textContent = music.paused ? "Play" : "Pause"; }

    async function togglePlayback() {
      try {
        ensureAudio();
        if (music.paused) {
          if (audioCtx.state === "suspended") await audioCtx.resume();
          await music.play();
          state.musicStarted = true;
          state.autoplayBlocked = false;
        } else {
          music.pause();
        }
      } catch (_) {}
      syncPlayPauseLabel();
    }

    function updateAudio() {
      if (!analyser || !audioData || !audioCtx) {
        audioState.sub *= 0.92;
        audioState.bass *= 0.92;
        audioState.low *= 0.92;
        audioState.mid *= 0.92;
        audioState.high *= 0.92;
        audioState.air *= 0.92;
        audioState.overall *= 0.92;
        audioState.kick *= 0.86;
        audioState.kickBody *= 0.90;
        audioState.kickTransient *= 0.72;
        return;
      }

      analyser.getByteFrequencyData(audioData);
      let subSum = 0, subCount = 0;
      let bassSum = 0, bassCount = 0;
      let lowSum = 0, lowCount = 0;
      let midSum = 0, midCount = 0;
      let highSum = 0, highCount = 0;
      let airSum = 0, airCount = 0;
      let kickSum = 0, kickCount = 0;
      let kickTailSum = 0, kickTailCount = 0;
      let totalSum = 0;

      for (let i = 0; i < audioData.length; i++) {
        const freq = i * (audioCtx.sampleRate / 2) / audioData.length;
        const value = audioData[i] / 255;
        totalSum += value;

        if (freq < 60) { subSum += value; subCount++; }
        else if (freq < 120) { bassSum += value; bassCount++; }
        else if (freq < 200) { lowSum += value; lowCount++; }
        else if (freq < 1200) { midSum += value; midCount++; }
        else if (freq < 4200) { highSum += value; highCount++; }
        else { airSum += value; airCount++; }

        if (freq >= 45 && freq <= 95) { kickSum += value; kickCount++; }
        else if (freq > 95 && freq <= 145) { kickTailSum += value; kickTailCount++; }
      }

      const sub = subCount ? subSum / subCount : 0;
      const bass = bassCount ? bassSum / bassCount : 0;
      const low = lowCount ? lowSum / lowCount : 0;
      const mid = midCount ? midSum / midCount : 0;
      const high = highCount ? highSum / highCount : 0;
      const air = airCount ? airSum / airCount : 0;
      const overall = totalSum / audioData.length;
      const kickBand = kickCount ? kickSum / kickCount : 0;
      const kickTail = kickTailCount ? kickTailSum / kickTailCount : 0;
      const kickEnergy = kickBand * 0.78 + kickTail * 0.22;
      const kickTransient = Math.max(0, kickEnergy - audioState.prevKickEnergy * 0.90);

      audioState.prevKickEnergy = kickEnergy;
      audioState.sub += (sub - audioState.sub) * 0.16;
      audioState.bass += (bass - audioState.bass) * 0.14;
      audioState.low += (low - audioState.low) * 0.14;
      audioState.mid += (mid - audioState.mid) * 0.10;
      audioState.high += (high - audioState.high) * 0.10;
      audioState.air += (air - audioState.air) * 0.08;
      audioState.overall += (overall - audioState.overall) * 0.10;
      audioState.kickBody += (kickEnergy - audioState.kickBody) * 0.22;
      audioState.kickTransient = Math.max(audioState.kickTransient * 0.76, kickTransient * 1.9);
      audioState.kick = clamp(audioState.kickBody * 0.62 + audioState.kickTransient * 1.08, 0, 1.6);
    }

    function updateElegantResponse(dt) {
      const flowTarget = saturate(audioState.mid * 0.78 + audioState.overall * 0.18 + audioState.kick * 0.24);
      const shimmerTarget = saturate(audioState.high * 0.82 + audioState.air * 0.42);
      const bloomTarget = saturate(audioState.kick * 0.42 + audioState.mid * 0.26 + audioState.high * 0.12);
      const ringTarget = saturate(audioState.mid * 0.58 + audioState.high * 0.28 + audioState.kick * 0.24);

      responseState.flow = THREE.MathUtils.lerp(responseState.flow, flowTarget, Math.min(1, dt * 3.0));
      responseState.shimmer = THREE.MathUtils.lerp(responseState.shimmer, shimmerTarget, Math.min(1, dt * 3.4));
      responseState.bloom = THREE.MathUtils.lerp(responseState.bloom, bloomTarget, Math.min(1, dt * 3.0));
      responseState.ring = THREE.MathUtils.lerp(responseState.ring, ringTarget, Math.min(1, dt * 3.2));

      state.portal.blend = THREE.MathUtils.lerp(state.portal.blend, state.portal.active ? 1 : 0, Math.min(1, dt * 1.8));
      state.portal.yaw = THREE.MathUtils.lerp(state.portal.yaw, state.portal.targetYaw, Math.min(1, dt * 7.0));
      state.portal.pitch = THREE.MathUtils.lerp(state.portal.pitch, state.portal.targetPitch, Math.min(1, dt * 7.0));
      state.flight.yaw = THREE.MathUtils.lerp(state.flight.yaw, state.flight.targetYaw, Math.min(1, dt * 7.0));
      state.flight.pitch = THREE.MathUtils.lerp(state.flight.pitch, state.flight.targetPitch, Math.min(1, dt * 7.0));
      state.portal.exitCooldown = Math.max(0, state.portal.exitCooldown - dt);
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(state.width, state.height);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x82a6cb, 1);
    host.appendChild(renderer.domElement);
    renderer.domElement.tabIndex = 0;
    renderer.domElement.style.outline = "none";

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xc7d8e7, 9000, 56000);

    const camera = new THREE.PerspectiveCamera(50, state.width / state.height, 1, 160000);
    camera.position.set(0, state.flight.y, 0);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const sunPosition = WORLD_SUN_POSITION.clone();

    const skyGeometry = new THREE.SphereGeometry(120000, 36, 24);
    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uTop: { value: BASE_SKY_TOP.clone() },
        uMid: { value: BASE_SKY_MID.clone() },
        uBottom: { value: BASE_SKY_BOTTOM.clone() },
        uSunPosition: { value: sunPosition.clone() },
        uUnderwater: { value: 0 },
        uUnderwaterDepth: { value: 0 }
      },
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vDir = normalize(worldPos.xyz - cameraPosition);
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uTop;
        uniform vec3 uMid;
        uniform vec3 uBottom;
        uniform vec3 uSunPosition;
        uniform float uUnderwater;
        uniform float uUnderwaterDepth;
        varying vec3 vDir;

        void main() {
          float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
          vec3 lowBand = mix(uBottom, uMid, smoothstep(0.0, 0.45, h));
          vec3 airColor = mix(lowBand, uTop, smoothstep(0.34, 1.0, h));
          vec3 sunDir = normalize(uSunPosition - cameraPosition);
          float sunCore = pow(max(dot(normalize(vDir), sunDir), 0.0), 1200.0);
          float sunGlow = pow(max(dot(normalize(vDir), sunDir), 0.0), 70.0);
          airColor += vec3(1.0, 0.98, 0.94) * sunCore * 1.45;
          airColor += vec3(1.0, 0.90, 0.78) * sunGlow * 0.28;
          vec3 underwaterTop = vec3(0.30, 0.64, 0.70);
          vec3 underwaterBottom = vec3(0.06, 0.18, 0.22);
          vec3 waterColor = mix(underwaterBottom, underwaterTop, pow(h, 1.7));
          float lookingUp = pow(max(vDir.y, 0.0), 2.4);
          float underwaterSun = pow(max(dot(normalize(vDir), sunDir), 0.0), 20.0);
          float underwaterGlow = pow(max(dot(normalize(vDir), sunDir), 0.0), 40.0);
          waterColor += vec3(0.46, 0.78, 0.84) * lookingUp * 0.55;
          waterColor += vec3(0.92, 0.99, 1.0) * underwaterSun * (0.74 - uUnderwaterDepth * 0.16);
          waterColor += vec3(0.64, 0.90, 0.98) * underwaterGlow * 0.56;
          gl_FragColor = vec4(mix(airColor, waterColor, uUnderwater), 1.0);
        }
      `
    });
    const sky = new THREE.Mesh(skyGeometry, skyMaterial);
    scene.add(sky);

    const hemiLight = new THREE.HemisphereLight(0xe6eef7, 0x1a3955, 1.0);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xfff3e2, 2.2);
    scene.add(dirLight);
    const underLight = new THREE.DirectionalLight(0x8ee6ff, 0.0);
    scene.add(underLight);

    function createGlowTexture(innerColor, outerColor) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");
      const grad = ctx.createRadialGradient(128, 128, 14, 128, 128, 126);
      grad.addColorStop(0, innerColor);
      grad.addColorStop(0.26, outerColor);
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(canvas);
    }

    const sunTexture = createGlowTexture("rgba(255,252,245,1)", "rgba(255,208,180,0.28)");
    const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: sunTexture,
      transparent: true,
      depthWrite: false,
      depthTest: false
    }));
    sunSprite.scale.set(2200, 2200, 1);
    sunSprite.renderOrder = 10;
    scene.add(sunSprite);

    const shipTexture = createGlowTexture("rgba(255,255,250,1)", "rgba(255,225,202,0.28)");
    const shipGroup = new THREE.Group();
    scene.add(shipGroup);

    function createRingSystem({ particleCount, radiusY, radiusZ, thickness, color, size, opacity, renderOrder }) {
      const positions = new Float32Array(particleCount * 3);
      const scales = new Float32Array(particleCount);
      const angles = new Float32Array(particleCount);
      const radialOffsets = new Float32Array(particleCount);
      const depthOffsets = new Float32Array(particleCount);

      for (let i = 0; i < particleCount; i++) {
        const index = i * 3;
        const angle = Math.random() * Math.PI * 2;
        const radialJitter = randomBetween(-thickness, thickness);
        const depthJitter = randomBetween(-thickness * 0.34, thickness * 0.34);
        angles[i] = angle;
        radialOffsets[i] = radialJitter;
        depthOffsets[i] = depthJitter;
        scales[i] = randomBetween(0.45, 1.35);
        positions[index] = depthJitter;
        positions[index + 1] = Math.cos(angle) * (radiusY + radialJitter);
        positions[index + 2] = Math.sin(angle) * (radiusZ + radialJitter * 0.42);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color,
        size,
        sizeAttenuation: true,
        transparent: true,
        opacity,
        depthWrite: false,
        depthTest: true,
        blending: THREE.AdditiveBlending
      });
      const points = new THREE.Points(geometry, material);
      points.rotation.set(0, -0.12, 0.10);
      points.renderOrder = renderOrder;
      points.frustumCulled = false;
      scene.add(points);
      return { particleCount, radiusY, radiusZ, positions, scales, angles, radialOffsets, depthOffsets, geometry, material, points };
    }

    const mainRing = createRingSystem({
      particleCount: 2800,
      radiusY: 2900,
      radiusZ: 1180,
      thickness: 180,
      color: 0xffd7b8,
      size: 22,
      opacity: 0.78,
      renderOrder: 5
    });

    const outerRing = createRingSystem({
      particleCount: 2200,
      radiusY: 3550,
      radiusZ: 1450,
      thickness: 120,
      color: 0xffdff2,
      size: 13,
      opacity: 0.34,
      renderOrder: 4
    });

    const formationDefinitions = [
      { anchor: new THREE.Vector3(-18000, 1800, 12000), slots: [[0, 420, 0], [-1700, -240, 1100], [1700, -240, 1100], [-850, 120, 2200], [850, 120, 2200]] },
      { anchor: new THREE.Vector3(-7000, 2400, 18500), slots: [[0, 420, 0], [-1900, 80, 900], [1900, 80, 900], [-1100, -260, 2200], [1100, -260, 2200]] },
      { anchor: new THREE.Vector3(5000, 3000, 24500), slots: [[0, 0, 0], [0, 420, 1600], [-1700, 0, 800], [1700, 0, 800], [0, -360, 2600]] },
      { anchor: new THREE.Vector3(18500, 2200, 31000), slots: [[0, 520, 0], [-1600, 0, 1200], [1600, 0, 1200], [0, -420, 2400]] },
      { anchor: new THREE.Vector3(-13000, 4200, 38000), slots: [[0, 500, 0], [-1800, 180, 900], [1800, 180, 900], [-1200, -260, 2200], [1200, -260, 2200]] },
      { anchor: new THREE.Vector3(3000, 5000, 47000), slots: [[0, 520, 0], [-1500, 160, 1000], [1500, 160, 1000], [-700, -260, 2200], [700, -260, 2200]] }
    ];

    const skyShips = [];
    const ambientSkyShips = [];

    function createShipSprite(baseOpacity = 0.78) {
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: shipTexture,
        transparent: true,
        depthWrite: false,
        depthTest: false,
        opacity: baseOpacity
      }));
      sprite.renderOrder = 6;
      shipGroup.add(sprite);
      return sprite;
    }

    formationDefinitions.forEach((formation, formationIndex) => {
      formation.slots.forEach((slotArray) => {
        skyShips.push({
          sprite: createShipSprite(0.90),
          formationIndex,
          slot: new THREE.Vector3(slotArray[0], slotArray[1], slotArray[2]),
          slotJitter: new THREE.Vector3(randomBetween(-90, 90), randomBetween(-70, 70), randomBetween(-100, 100)),
          scale: randomBetween(500, 760),
          phase: Math.random() * Math.PI * 2,
          drift: randomBetween(0.7, 1.35),
          pulseBias: randomBetween(0.95, 1.5),
          localOrbit: randomBetween(0.65, 1.25),
          twinkleRate: randomBetween(1.4, 2.8),
          twinkleDepth: randomBetween(0.08, 0.22),
          strafeBias: randomBetween(0.8, 1.4)
        });
      });
    });

    for (let i = 0; i < 42; i++) {
      const highBand = Math.random() < 0.84;
      ambientSkyShips.push({
        sprite: createShipSprite(0.76),
        base: new THREE.Vector3(randomBetween(-32000, 32000), highBand ? randomBetween(7200, 15200) : randomBetween(2600, 7000), randomBetween(10000, 52000)),
        scale: highBand ? randomBetween(240, 520) : randomBetween(320, 660),
        phase: Math.random() * Math.PI * 2,
        drift: randomBetween(0.35, 1.2),
        pulseBias: randomBetween(0.7, 1.35),
        swayX: randomBetween(380, 1600),
        swayY: randomBetween(40, 320),
        swayZ: randomBetween(160, 1100),
        lowBias: highBand ? 0 : (Math.random() < 0.38 ? randomBetween(-1000, 0) : 0),
        twinkleRate: randomBetween(3.8, 7.2),
        twinkleDepth: randomBetween(0.18, 0.38),
        highBand,
        strafeBias: randomBetween(0.9, 1.7)
      });
    }

    for (let i = 0; i < 58; i++) {
      const farHigh = Math.random() < 0.78;
      ambientSkyShips.push({
        sprite: createShipSprite(0.70),
        base: new THREE.Vector3(
          randomBetween(-36000, 36000),
          farHigh ? randomBetween(9000, 19000) : randomBetween(5200, 9800),
          randomBetween(-32000, -5600)
        ),
        scale: farHigh ? randomBetween(220, 500) : randomBetween(300, 620),
        phase: Math.random() * Math.PI * 2,
        drift: randomBetween(0.28, 1.05),
        pulseBias: randomBetween(0.65, 1.28),
        swayX: randomBetween(480, 1900),
        swayY: randomBetween(70, 420),
        swayZ: randomBetween(240, 1300),
        lowBias: farHigh ? 0 : randomBetween(-600, 300),
        twinkleRate: randomBetween(3.2, 7.8),
        twinkleDepth: randomBetween(0.16, 0.42),
        highBand: farHigh,
        strafeBias: randomBetween(0.85, 1.75)
      });
    }

    function createRuneTexture(seed = 0) {
      const canvas = document.createElement("canvas");
      canvas.width = 96;
      canvas.height = 96;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, 96, 96);
      ctx.translate(48, 48);
      ctx.rotate((seed % 1) * 0.10 - 0.05);
      ctx.translate(-48, -48);

      ctx.shadowColor = "rgba(120, 210, 255, 0.7)";
      ctx.shadowBlur = 16;
      const glyphs = ["ॐ", "श्री", "ह्रीं", "क्लीं", "रं", "यं", "नमः", "सः"];
      const glyph = glyphs[Math.floor(seed * 17) % glyphs.length];

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = glyph.length > 2 ? "34px Georgia, serif" : "44px Georgia, serif";
      ctx.fillStyle = "rgba(225, 246, 255, 0.96)";
      ctx.fillText(glyph, 48, 48);

      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(178, 232, 255, 0.72)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(18, 23);
      ctx.quadraticCurveTo(48, 17, 78, 23);
      ctx.stroke();

      ctx.strokeStyle = "rgba(132, 255, 218, 0.42)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(48, 51, 31, Math.PI * 0.08, Math.PI * 0.92);
      ctx.stroke();

      ctx.fillStyle = "rgba(255, 255, 255, 0.58)";
      ctx.beginPath();
      ctx.arc(76, 27, 2.4, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function pseudoRandom(seed, index) {
      const value = Math.sin(seed * 91.7 + index * 37.31) * 43758.5453;
      return value - Math.floor(value);
    }

    function createGlyphTabletTexture(seed = 0) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, 256, 128);
      ctx.shadowColor = "rgba(115, 215, 255, 0.68)";
      ctx.shadowBlur = 14;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const phrases = [
        "ॐ नमः",
        "श्रीं ह्रीं",
        "ॐ श्री",
        "रं यं",
        "ह्रीं ॐ",
        "सः नमः",
        "ॐ क्लीं",
        "श्री नमः"
      ];
      const phrase = phrases[Math.floor(seed * 13) % phrases.length];

      ctx.font = "34px Georgia, serif";
      ctx.fillStyle = "rgba(230, 250, 255, 0.94)";
      ctx.fillText(phrase, 128, 62);

      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(178, 232, 255, 0.70)";
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(30, 31);
      ctx.quadraticCurveTo(128, 19 + pseudoRandom(seed, 4) * 10, 226, 31);
      ctx.stroke();

      ctx.strokeStyle = "rgba(126, 255, 214, 0.45)";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(42, 93);
      ctx.quadraticCurveTo(128, 104 - pseudoRandom(seed, 8) * 8, 214, 93);
      ctx.stroke();

      ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(42 + i * 42 + pseudoRandom(seed, i + 20) * 5, 36 + pseudoRandom(seed, i + 30) * 52, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    function makeBeamTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 1024;
      const ctx = canvas.getContext("2d");
      const g = ctx.createLinearGradient(0, 0, 256, 0);
      g.addColorStop(0.00, "rgba(130,220,255,0)");
      g.addColorStop(0.10, "rgba(100,210,255,0.32)");
      g.addColorStop(0.25, "rgba(190,130,255,0.44)");
      g.addColorStop(0.42, "rgba(255,118,220,0.40)");
      g.addColorStop(0.56, "rgba(150,170,255,0.34)");
      g.addColorStop(0.72, "rgba(92,255,198,0.42)");
      g.addColorStop(0.90, "rgba(108,220,255,0.34)");
      g.addColorStop(1.00, "rgba(130,220,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 1024);
      const vertical = ctx.createLinearGradient(0, 0, 0, 1024);
      vertical.addColorStop(0, "rgba(255,255,255,0)");
      vertical.addColorStop(0.13, "rgba(255,255,255,0.72)");
      vertical.addColorStop(0.50, "rgba(255,255,255,0.62)");
      vertical.addColorStop(0.82, "rgba(255,255,255,0.48)");
      vertical.addColorStop(1, "rgba(255,255,255,0)");
      ctx.globalCompositeOperation = "destination-in";
      ctx.fillStyle = vertical;
      ctx.fillRect(0, 0, 256, 1024);
      return new THREE.CanvasTexture(canvas);
    }

    function createAlignedTetrahedronGeometry(size) {
      const topY = size;
      const baseY = -size * 0.34;
      const baseRadius = size * 0.96;
      const positions = new Float32Array([
        0, topY, 0,
        baseRadius, baseY, 0,
        -baseRadius * 0.5, baseY, baseRadius * 0.8660254,
        -baseRadius * 0.5, baseY, -baseRadius * 0.8660254
      ]);
      const indices = [
        0, 1, 2,
        0, 2, 3,
        0, 3, 1,
        1, 3, 2
      ];
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

        warpStreakPositions[index] = x;
        warpStreakPositions[index + 1] = y;
        warpStreakPositions[index + 2] = z;
        warpStreakPositions[index + 3] = x;
        warpStreakPositions[index + 4] = y;
        warpStreakPositions[index + 5] = z + 480;
        warpStreakDrift[i] = randomBetween(0.7, 2.4);
        warpStreakColors[index] = color.r;
        warpStreakColors[index + 1] = color.g;

      }

      const warpStreakGeometry = new THREE.BufferGeometry();
      warpStreakGeometry.setAttribute("position", new THREE.BufferAttribute(warpStreakPositions, 3));
      warpStreakGeometry.setAttribute("color", new THREE.BufferAttribute(warpStreakColors, 3));
      const warpStreakMaterial = new THREE.LineBasicMaterial({
        transparent: true,

      });
      const warpStreaks = new THREE.LineSegments(warpStreakGeometry, warpStreakMaterial);

      group.add(warpStreaks);

      const orbTexture = createGlowTexture("rgba(255,255,255,0.98)", "rgba(150,200,255,0.28)");
      const orbs = [];
      for (let i = 0; i < PORTAL_ORB_COUNT; i++) {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: orbTexture,
          transparent: true,
          depthWrite: false,
          depthTest: false,
          opacity: 0.55,

        }));

        group.add(sprite);
        orbs.push({
          sprite,
          radius: randomBetween(1600, 7200),
          depth: randomBetween(4200, 11800),
          height: randomBetween(-3200, 3600),

          scale: randomBetween(46, 190),
          wobble: randomBetween(140, 620)
        });
      }

      return {
        group,
        dome,
        coreGroup,
        coreSphere,
        ringA,
        ringB,
        ringC,
        coreGlow,
        starTetrahedron,
        particles,
        particleGeometry,
        particleMaterial,
        portalPositions,
        portalDrift,
        warpStars,
        warpStarGeometry,
        warpStarMaterial,
        warpStarPositions,
        warpStarDrift,
        warpStreaks,
        warpStreakGeometry,
        warpStreakMaterial,
        warpStreakPositions,
        warpStreakDrift,

    }

    const portalWorld = createPortalWorld();

    const oceanGeometry = new THREE.PlaneGeometry(52000, 52000, 260, 260);
    oceanGeometry.rotateX(-Math.PI / 2);
    const waterUniforms = {
      uTime: { value: 0 },
      uOrigin: { value: new THREE.Vector2(0, 0) },
      uSunPosition: { value: sunPosition.clone() },
      uDeep: { value: BASE_WATER_DEEP.clone() },
      uMid: { value: BASE_WATER_MID.clone() },
      uShallow: { value: BASE_WATER_SHALLOW.clone() },
      uMist: { value: BASE_WATER_MIST.clone() },
      uUnderwater: { value: 0 },
      uUnderwaterDepth: { value: 0 },
      uWaveScale: { value: WAVE_SCALE },
      uWaveSpacing: { value: WAVE_SPACING }
    };

    const waterMaterial = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      side: THREE.DoubleSide,
      fog: false,
      vertexShader: `
        uniform float uTime;
        uniform vec2 uOrigin;
        uniform float uWaveScale;
        uniform float uWaveSpacing;
        varying vec3 vWorldPos;
        varying vec3 vNormalW;
        varying float vDistFade;
        varying vec2 vSurfaceCoord;
        varying float vWaveMask;
        const float PHI = 1.61803398875;
        const float SQ2 = 1.41421356237;
        const float SQ3 = 1.73205080757;
        float hash21(vec2 p) {
          p = fract(p * vec2(234.34, 435.345));
          p += dot(p, p + 34.23);
          return fract(p.x * p.y);
        }
        float valueNoise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = hash21(i);
          float b = hash21(i + vec2(1.0, 0.0));
          float c = hash21(i + vec2(0.0, 1.0));
          float d = hash21(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
          for (int i = 0; i < 5; i++) {
            v += (valueNoise(p) * 2.0 - 1.0) * a;
            p = m * p;
            a *= 0.52;
          }
          return v;
        }
        float oceanHeight(vec2 worldP, float t) {
          vec2 p = worldP / uWaveSpacing;
          vec2 warpA = vec2(fbm(p * 0.0017 + vec2(t * 0.028, -t * 0.022)), fbm(p * 0.0019 + vec2(-t * 0.020, t * 0.024)));
          vec2 warpB = vec2(sin(p.y * 0.00125 + t * 0.44 + PHI) * 42.0, cos(p.x * 0.00115 - t * 0.38 + SQ2) * 36.0);
          vec2 warpC = vec2(sin((p.x + p.y * SQ3) * 0.00092 + t * 0.31) * 28.0, cos((p.y - p.x * PHI) * 0.00106 - t * 0.27) * 24.0);
          vec2 q = p + warpA * 165.0 + warpB + warpC;
          float swellA = sin(q.x * 0.0036 + q.y * 0.0122 + t * 0.72) * 12.8;
          float swellB = sin(q.x * 0.0068 - q.y * 0.0051 + t * 0.51 + 1.57) * 9.8;
          float swellC = sin((q.x + q.y * PHI) * 0.00175 + t * 0.29 + 2.42) * 12.2;
          float swellD = sin((q.x * 0.58 - q.y * 1.31) * 0.0049 - t * 0.42 + 0.84) * 8.1;
          float breakupA = fbm(q * 0.0025 + vec2(t * 0.040, -t * 0.028)) * 4.8;
          float breakupB = fbm(q * 0.0062 + vec2(-t * 0.083, t * 0.061)) * 3.2;
          float chopA = fbm(q * 0.0115 + vec2(t * 0.120, -t * 0.090)) * 2.2;
          float chopB = sin((q.x - q.y) * 0.0105 + t * 0.95) * 1.5;
          float chopC = sin((q.x * PHI + q.y * SQ2) * 0.0072 - t * 0.67) * 1.1;
          float baseWave = swellA + swellB + swellC + swellD + breakupA + breakupB + chopA + chopB + chopC;

        }
        vec3 displaced(vec3 pos) {
          vec2 worldXZ = pos.xz + uOrigin;
          return vec3(pos.x, oceanHeight(worldXZ, uTime), pos.z);
        }
        void main() {
          vec3 p = displaced(position);
          float e = 18.0;
          vec3 px = displaced(position + vec3(e, 0.0, 0.0));
          vec3 pz = displaced(position + vec3(0.0, 0.0, e));
          vec3 n = normalize(cross(pz - p, px - p));
          vec4 worldPos = modelMatrix * vec4(p, 1.0);
          vWorldPos = worldPos.xyz;
          vNormalW = normalize(mat3(modelMatrix) * n);
          vDistFade = clamp(distance(cameraPosition.xz, worldPos.xz) / 52000.0, 0.0, 1.0);
          vSurfaceCoord = worldPos.xz / uWaveSpacing;

      `,
      fragmentShader: `
        uniform vec3 uSunPosition;
        uniform vec3 uDeep;
        uniform vec3 uMid;
        uniform vec3 uShallow;
        uniform vec3 uMist;
        uniform float uTime;
        uniform float uUnderwater;
        uniform float uUnderwaterDepth;
        varying vec3 vWorldPos;
        varying vec3 vNormalW;
        varying float vDistFade;
        varying vec2 vSurfaceCoord;
        varying float vWaveMask;
        const float PHI = 1.61803398875;
        const float SQ2 = 1.41421356237;
        float hash21(vec2 p) {
          p = fract(p * vec2(234.34, 435.345));
          p += dot(p, p + 34.23);
          return fract(p.x * p.y);
        }
        float valueNoise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = hash21(i);
          float b = hash21(i + vec2(1.0, 0.0));
          float c = hash21(i + vec2(0.0, 1.0));
          float d = hash21(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
          for (int i = 0; i < 4; i++) {
            v += (valueNoise(p) * 2.0 - 1.0) * a;
            p = m * p;
            a *= 0.52;
          }
          return v;
        }
        void main() {
          vec3 N = normalize(vNormalW);
          vec2 p = vSurfaceCoord;
          float t = uTime;

          vec2 microWarp = vec2(
            fbm(p * 0.086 + vec2(t * 0.10, -t * 0.07)),
            fbm(p * 0.118 + vec2(-t * 0.13, t * 0.09) + vec2(PHI, SQ2))

          float microA = fbm((p + microWarp * 10.0) * 0.34 + vec2(t * 0.26, -t * 0.19));
          float microB = fbm((p - microWarp * 13.0) * 0.46 + vec2(-t * 0.31, t * 0.23));
          vec3 microNormal = normalize(N + vec3((microA - 0.5) * 0.13, 0.0, (microB - 0.5) * 0.13) * (1.0 - vDistFade * 0.52));
          N = normalize(mix(N, microNormal, 0.58));

          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 L = normalize(uSunPosition - vWorldPos);
          vec3 R = reflect(-L, N);
          vec3 H = normalize(V + L);
          vec3 surfaceColor = mix(uShallow, uMid, smoothstep(0.0, 0.30, vDistFade));
          surfaceColor = mix(surfaceColor, uDeep, smoothstep(0.30, 1.0, vDistFade));
          float crest = smoothstep(0.045, 0.19, vWaveMask) * (1.0 - smoothstep(0.18, 0.92, vDistFade));
          float lace = smoothstep(0.50, 0.88, fbm((p + microWarp * 18.0) * 0.18 + vec2(t * 0.18, -t * 0.14))) * crest;
          surfaceColor = mix(surfaceColor, vec3(0.76, 0.93, 1.0), crest * 0.075 + lace * 0.15);
          surfaceColor *= max(dot(N, L), 0.0) * 0.22 + 0.78;
          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 4.5);
          float broadSpec = pow(max(dot(R, V), 0.0), 26.0);
          float sharpSpec = pow(max(dot(H, N), 0.0), 120.0);
          vec2 shimmerWarp = vec2(fbm(p * 0.064 + vec2(t * 0.13, -t * 0.08)), fbm(p * 0.093 + vec2(-t * 0.18, t * 0.11) + vec2(PHI, SQ2)));
          float glintFieldA = fbm((p + shimmerWarp * 16.0) * 0.082 + vec2(t * 0.17, -t * 0.11));
          float glintFieldB = fbm((p - shimmerWarp * 22.0) * 0.127 + vec2(-t * 0.23, t * 0.15));
          float glintFieldC = fbm((p + vec2(glintFieldA, glintFieldB) * 26.0) * 0.205 + vec2(t * 0.31, -t * 0.24));
          float softMask = smoothstep(0.34, 0.86, glintFieldA * 0.46 + glintFieldB * 0.34 + glintFieldC * 0.20);
          float tightMask = smoothstep(0.61, 0.93, glintFieldB * 0.52 + glintFieldC * 0.48);
          float reflectionFacing = clamp(dot(reflect(-L, N), V), 0.0, 1.0);
          float horizonFacing = clamp(1.0 - abs(dot(N, vec3(0.0, 1.0, 0.0))), 0.0, 1.0);
          float slopeBoost = mix(0.78, 1.26, vWaveMask);
          float glint = (pow(reflectionFacing, 10.0) * (0.20 + softMask * 0.45) + pow(reflectionFacing, 24.0) * (0.12 + softMask * 0.35) + pow(reflectionFacing, 54.0) * tightMask * 0.55) * slopeBoost;
          vec3 airColor = surfaceColor;
          airColor += vec3(1.0, 0.98, 0.94) * broadSpec * 0.45;
          airColor += vec3(1.0, 0.985, 0.95) * sharpSpec * 0.20;
          airColor += vec3(1.0, 0.98, 0.95) * glint * (0.48 + horizonFacing * 0.34);
          airColor += vec3(0.90, 0.96, 1.0) * fresnel * 0.18;
          airColor += vec3(0.72, 0.90, 1.0) * lace * 0.08;
          airColor = mix(airColor, uMist, smoothstep(0.55, 1.0, vDistFade) * 0.34);
          vec3 underwaterBase = mix(vec3(0.03, 0.16, 0.18), vec3(0.12, 0.42, 0.46), 1.0 - vDistFade * 0.6);
          float underwaterSpec = pow(max(dot(R, V), 0.0), 18.0);
          float underwaterFresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
          float upGlow = pow(max(dot(normalize(V), normalize(vec3(0.0, 1.0, 0.0))), 0.0), 2.0);
          vec3 underwaterColor = underwaterBase;
          underwaterColor += vec3(0.76, 0.94, 1.0) * underwaterSpec * (0.84 - uUnderwaterDepth * 0.14);
